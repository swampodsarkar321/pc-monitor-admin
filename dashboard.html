<!DOCTYPE html><html><head><meta charset="utf-8"><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script></head>
<body class="bg-[#0b1220] text-slate-100"><div class="flex" id="lay"></div>
<script src="common.js"></script><script>
lay.innerHTML=nav('dashboard.html')+`<main class="flex-1 p-4 md:px-6 md:py-4 space-y-3"><div id="topbar"></div>
<div id="setup"></div>
<div class="hero rounded-2xl px-5 py-4 flex flex-wrap items-center gap-x-8 gap-y-3">
<div><div class="text-[10px] tracking-[.15em] opacity-60">TIME</div><div class="flex items-baseline gap-2"><span id="tm" class="num text-3xl font-bold">-</span><span id="tm_sub" class="text-[11px] opacity-60"></span></div></div>
<div><div class="text-[10px] tracking-[.15em] opacity-60">CLICKS</div><div id="ck" class="num text-3xl font-bold">-</div></div>
<div><div class="text-[10px] tracking-[.15em] opacity-60">ALERTS</div><div id="al" class="num text-3xl font-bold">-</div></div>
<div><div class="text-[10px] tracking-[.15em] opacity-60">DEVICES</div><div id="cc" class="num text-3xl font-bold">-</div></div>
<select id="dr" onchange="render()" class="ml-auto bg-black/30 border border-white/10 rounded-xl px-3 py-2 text-xs"><option value="0">Today</option><option value="1">Yesterday</option><option value="7">Last 7 days</option></select></div>
<div class="grid cols3 grid-cols-5 gap-3">
<div class="bg-[#111c33] rounded-2xl p-4 col-span-2"><b class="flex items-center gap-2 text-[13px]"><i data-lucide="activity" class="w-4 h-4 text-emerald-300"></i>Live Status</b><div id="live" class="mt-1.5"></div></div>
<div class="bg-[#111c33] rounded-2xl p-4 col-span-3"><b class="flex items-center gap-2 text-[13px]"><i data-lucide="siren" class="w-4 h-4 text-red-300"></i>Recent Alerts</b><div id="feed" class="mt-1.5 max-h-52 overflow-auto"></div></div>
</div>
<div class="grid cols3 grid-cols-5 gap-3">
<div class="bg-[#111c33] rounded-2xl p-4 col-span-2"><b class="flex items-center gap-2 text-[13px]"><i data-lucide="clock" class="w-4 h-4 text-sky-300"></i>Top Sites</b><div id="ts" class="mt-1.5 space-y-1"></div></div>
<div class="bg-[#111c33] rounded-2xl p-4 col-span-3"><b class="flex items-center gap-2 text-[13px]"><i data-lucide="bar-chart-3" class="w-4 h-4 text-violet-300"></i>Usage (min)</b><div style="height:200px"><canvas id="ch"></canvas></div></div>
</div></main>`;
function fmtT(sec){sec=Math.round(sec);if(sec<60)return sec+'s';const m=Math.floor(sec/60);if(m<60)return m+'m';return Math.floor(m/60)+'h '+(m%60)+'m';}
let CH=null, ALL=[];
showLoader();connErr();mountTopbar('Dashboard'+(QDEV?' — '+QDEV:''),'layout-dashboard');setTimeout(maybeTour,2500);
db.ref('events').limitToLast(800).on('value',s=>{hideLoader();ALL=Object.values(s.val()||{}).sort((a,b)=>b.ts-a.ts);render();});
function range(){const d=+document.getElementById('dr').value;const n=new Date();
if(d===0){n.setHours(0,0,0,0);return [n.getTime(),Date.now()];}
if(d===1){const s=new Date();s.setDate(s.getDate()-1);s.setHours(0,0,0,0);const e=new Date();e.setDate(e.getDate()-1);e.setHours(23,59,59,999);return [s.getTime(),e.getTime()];}
return [Date.now()-7*864e5,Date.now()];}
function render(){
const [t0,t1]=range();
const all=ALL;const cs=new Set(all.map(e=>e.clientId));cc.innerText=cs.size;
// live status wall
const m={};all.forEach(e=>{(m[e.clientId]||={last:0,ua:''});m[e.clientId].last=Math.max(m[e.clientId].last,e.ts);if(e.type==='device_online'&&e.data?.ua)m[e.clientId].ua=e.data.ua;});
live.innerHTML=Object.entries(m).filter(([id])=>!HIDDEN[id]&&(!QDEV||id===QDEV)).map(([id,v])=>{const on=Date.now()-v.last<ONLINE_MS;
return `<a href="timeline.html?c=${encodeURIComponent(id)}" class="drow bg-white/[.03] hover:bg-white/10"><span class="w-2 h-2 rounded-full shrink-0 ${on?'bg-emerald-400 animate-pulse':'bg-red-500'}"></span><span class="min-w-0"><b class="truncate block">${id}</b><span class="block text-[10px] opacity-50 truncate">${parseUA(v.ua)}</span></span><span class="text-[10px] opacity-50 ml-auto shrink-0">${on?'online':timeAgo(v.last)}</span><button onclick="event.preventDefault();hideDev('${id}')" title="Hide device" class="text-[10px] opacity-0 hover:opacity-100 hover:text-red-300">✕</button></a>`;}).join('')||emptyBox('No devices yet');
// alerts feed
const al9=all.filter(e=>['keyword_alert','blocked','violation','inactive_alert'].includes(e.type)).slice(0,12);
feed.innerHTML=al9.map(e=>`<div class="drow bg-red-500/[.07] border border-red-500/15"><i data-lucide="triangle-alert" class="w-3.5 h-3.5 text-red-300 shrink-0"></i><span class="min-w-0"><b>${e.type}</b> <span class="opacity-60">• ${e.clientId}</span><span class="block text-[10px] opacity-50 truncate">${e.data?.url||''} • ${timeAgo(e.ts)}</span></span></div>`).join('')||emptyBox('No alerts — all good');if(window.lucide)lucide.createIcons();
const a=all.filter(e=>(!QDEV||e.clientId===QDEV)&&e.ts>=t0&&e.ts<=t1);
const tsecs=a.filter(e=>e.type==='time_spent').reduce((x,e)=>x+(e.data.sec||0),0);
tm.innerText=fmtT(tsecs);tm_sub.innerText=a.filter(e=>e.type==='time_spent').length+' sessions';
ck.innerText=a.filter(e=>e.type==='click').length;al.innerText=a.filter(e=>['keyword_alert','blocked','violation','inactive_alert'].includes(e.type)).length;
const agg={};a.filter(e=>e.type==='time_spent').forEach(e=>{try{let h=new URL(e.data.url).hostname.replace(/^www\./,'');const p=h.split('.');if(p.length>2)h=p.slice(-2).join('.');agg[h]=(agg[h]||0)+e.data.sec;}catch(_){}});
const keys=Object.keys(agg).sort((x,y)=>agg[y]-agg[x]).slice(0,8);
const mx=Math.max(...Object.values(agg),1);
ts.innerHTML=keys.length?keys.map(k=>`<div><div class="flex justify-between text-[12px]"><span class="truncate flex items-center gap-1.5"><i data-lucide="globe" class="w-3 h-3 opacity-50"></i>${k}</span><b class="num">${fmtT(agg[k])}</b></div><div class="h-1 rounded-full bg-white/5 mt-1"><div class="h-1 rounded-full" style="width:${Math.round(agg[k]/mx*100)}%;background:linear-gradient(90deg,#34d399,#22d3ee)"></div></div></div>`).join(''):emptyBox('No time data in this range');if(window.lucide)lucide.createIcons();
if(CH)CH.destroy();const ctx=ch.getContext('2d');const gr=ctx.createLinearGradient(0,0,0,220);gr.addColorStop(0,'#34d399');gr.addColorStop(1,'rgba(52,211,153,.25)');
CH=new Chart(ch,{type:'bar',data:{labels:keys.slice(0,6),datasets:[{data:keys.slice(0,6).map(k=>Math.round(agg[k]/60)),backgroundColor:gr,hoverBackgroundColor:'#34d399',borderRadius:10,maxBarThickness:44}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0f172a',borderColor:'#34d399',borderWidth:1,padding:10,callbacks:{label:c=>' '+c.parsed.y+' min'}}},scales:{x:{ticks:{color:'#cbd5e1',font:{size:11,weight:'600'}},grid:{display:false}},y:{beginAtZero:true,ticks:{color:'#94a3b8'},grid:{color:'rgba(255,255,255,.06)'},title:{display:true,text:'minutes',color:'#64748b',font:{size:10}}}}}});
// onboarding checklist
(async()=>{try{const tg=await db.ref('settings/telegram').once('value');const hasData=ALL.length>0;
const steps=[[hasData,'Connect first device'],[tg.val()?.token,'Save Telegram alerts'],[QDEV,'Select a device']];
if(steps.some(s=>!s[0])){setup.innerHTML=`<div class="bg-sky-500/10 border border-sky-500/30 rounded-2xl p-4 text-sm"><b class="flex items-center gap-2"><i data-lucide="rocket" class="w-4 h-4"></i>Setup checklist</b><div class="mt-2 space-y-1">`+steps.map(s=>`<div class="flex items-center gap-2">${s[0]?'<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i>':'<i data-lucide="square" class="w-4 h-4 opacity-40"></i>'}<span class="${s[0]?'opacity-60 line-through':''}">${s[1]}</span></div>`).join('')+`</div></div>`;if(window.lucide)lucide.createIcons();}else setup.innerHTML='';}catch(e){}})();}
</script></body></html>
