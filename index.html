<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>body{font-family:'Inter',sans-serif;background:#05080f}h1{font-family:'Sora',sans-serif}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,30px)}}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fadeup{animation:fadeup .5s ease-out both}.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}</style></head>
<body class="text-white min-h-screen overflow-hidden" onload="lucide.createIcons()">
<div class="fixed -top-32 -left-32 w-[480px] h-[480px] rounded-full bg-emerald-500/15 blur-[120px]" style="animation:float1 9s ease-in-out infinite"></div>
<div class="fixed -bottom-40 -right-24 w-[520px] h-[520px] rounded-full bg-cyan-500/15 blur-[130px]" style="animation:float2 11s ease-in-out infinite"></div>
<div class="fixed top-1/3 left-1/2 w-[300px] h-[300px] rounded-full bg-violet-600/10 blur-[100px]"></div>
<div class="relative min-h-screen grid place-items-center p-4">
<div class="w-full max-w-[400px] rounded-[28px] p-[1px]" style="background:linear-gradient(160deg,rgba(52,211,153,.5),rgba(255,255,255,.08) 40%,rgba(34,211,238,.4))">
<div class="rounded-[27px] bg-[#0a0f1c]/95 backdrop-blur-xl p-8 space-y-4">
<div class="fadeup flex items-center gap-3"><span class="w-12 h-12 rounded-2xl grid place-items-center shadow-lg shadow-emerald-500/30" style="background:linear-gradient(135deg,#34d399,#22d3ee)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z" fill="#06281c"/></svg></span>
<div><h1 class="text-xl leading-none">Nexa Monitor</h1><div class="text-[10px] tracking-[.28em] text-emerald-300/70 mt-1">COMMAND CENTER</div></div></div>
<div class="fadeup d1 grid grid-cols-2 gap-1.5 p-1.5 bg-black/40 border border-white/5 rounded-2xl">
<button id="tabA" onclick="tab('a')" class="py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2" style="background:linear-gradient(135deg,#34d399,#22d3ee);color:#06281c"><i data-lucide="crown" class="w-4 h-4"></i>Admin</button>
<button id="tabM" onclick="tab('m')" class="py-2.5 rounded-xl text-sm font-semibold text-slate-400 flex items-center justify-center gap-2"><i data-lucide="eye" class="w-4 h-4"></i>Moderator</button></div>
<div class="fadeup d1 flex justify-center gap-6 text-xs"><button onclick="xtab('in')" id="xtIn" class="font-bold text-emerald-300 border-b-2 border-emerald-400 pb-0.5">Sign In</button><button onclick="xtab('up')" id="xtUp" class="opacity-50 hover:opacity-90">Create account</button></div>
<div class="fadeup d2 space-y-3">
<div class="relative group"><i data-lucide="mail" class="w-4 h-4 absolute left-4 top-4 opacity-40 group-focus-within:opacity-100 group-focus-within:text-emerald-300 transition"></i><input id="u" placeholder="Email address" class="w-full bg-black/40 border border-white/10 rounded-2xl pl-11 pr-4 py-3.5 text-sm outline-none focus:border-emerald-400/70 focus:bg-black/60 transition"></div>
<div class="relative group"><i data-lucide="lock" class="w-4 h-4 absolute left-4 top-4 opacity-40 group-focus-within:opacity-100 group-focus-within:text-emerald-300 transition"></i><input id="p" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')go()" class="w-full bg-black/40 border border-white/10 rounded-2xl pl-11 pr-4 py-3.5 text-sm outline-none focus:border-emerald-400/70 focus:bg-black/60 transition"></div>
</div>
<div id="err" class="text-xs text-red-400 min-h-[16px]"></div>
<button onclick="go()" id="goBtn" class="fadeup d3 w-full font-extrabold py-3.5 rounded-2xl text-slate-950 flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/25 hover:brightness-110 hover:shadow-emerald-500/40 active:scale-[.98] transition" style="background:linear-gradient(135deg,#34d399,#22d3ee)">Sign In</button>
<div class="flex items-center justify-center gap-4 text-[11px] opacity-40"><span class="flex items-center gap-1"><i data-lucide="shield-check" class="w-3 h-3"></i>Encrypted</span><span class="flex items-center gap-1"><i data-lucide="zap" class="w-3 h-3"></i>Realtime</span><span class="flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3"></i>Private</span></div>
</div></div></div>
<script>
firebase.initializeApp({databaseURL:"https://fram-and-go-default-rtdb.asia-southeast1.firebasedatabase.app"});
const db=firebase.database();let mode='a',xmode='in';
const ON='py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2',OFF='py-2.5 rounded-xl text-sm font-semibold text-slate-400 flex items-center justify-center gap-2';
function tab(m){mode=m;tabA.className=ON+(m==='a'?'':' bg-transparent');tabM.className=OFF+(m==='m'?'':' bg-transparent');
tabA.style.cssText=m==='a'?'background:linear-gradient(135deg,#34d399,#22d3ee);color:#06281c':'';tabM.style.cssText=m==='m'?'background:linear-gradient(135deg,#34d399,#22d3ee);color:#06281c':'';lucide.createIcons();}
function xtab(m){xmode=m;xtIn.className=m==='in'?'font-bold text-emerald-300 border-b-2 border-emerald-400 pb-0.5':'opacity-50 hover:opacity-90';xtUp.className=m==='up'?'font-bold text-emerald-300 border-b-2 border-emerald-400 pb-0.5':'opacity-50 hover:opacity-90';goBtn.innerHTML=m==='in'?'Sign In':'Request Account';}
const key=e=>e.toLowerCase().replace(/[.#$\[\]]/g,'_');
async function go(){
  const em=u.value.trim().toLowerCase(),pw=p.value;if(!em||!pw){err.innerText='Enter email and password';return;}
  err.innerText='Verifying...';
  try{
    const ad=await db.ref('settings/admin').once('value');
    if(!ad.val())await db.ref('settings/admin').set({email:'mdswampodsarkar@gmail.com',pass:'srs321@@'});
    if(xmode==='up'){
      if(mode!=='a'){err.innerText='Only admin accounts can request';return;}
      await db.ref('requests/'+key(em)).set({email:em,pass:pw,plan:'free',status:'pending',ts:Date.now()});
      err.innerText='';alert('Request sent — wait for master approval');return;
    }
    if(mode==='a'){
      const a=(await db.ref('settings/admin').once('value')).val();
      if(em===a.email.toLowerCase()&&pw===a.pass){window.name='nexa:admin';location.href='dashboard.html';return;}
      const ap=(await db.ref('admins/'+key(em)).once('value')).val();
      if(ap&&ap.status==='approved'&&pw===ap.pass){window.name='nexa:admin:'+em;location.href='dashboard.html';}
      else if(ap&&ap.status!=='approved')err.innerText='Account pending master approval';
      else err.innerText='Invalid admin credentials';
    }else{
      const m=(await db.ref('mods/'+key(em)).once('value')).val();
      if(m&&pw===m.pass){window.name='nexa:mod:'+em;location.href='dashboard.html';}
      else err.innerText='Invalid moderator credentials';
    }
  }catch(e){err.innerText='Connection error — check your internet';}
}
</script></body></html>
