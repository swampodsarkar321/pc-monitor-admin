<!DOCTYPE html><html><head><meta charset="utf-8"><script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script></head>
<body class="bg-[#0b1220] text-slate-100"><div class="flex" id="lay"></div>
<script src="common.js"></script><script>
lay.innerHTML=nav('setup.html')+`<main class="flex-1 p-4 md:p-6 max-w-3xl space-y-4">
<h1 class="text-2xl font-black flex items-center gap-2"><i data-lucide="graduation-cap" class="w-6 h-6"></i>Setup Guide</h1>
<p class="text-sm opacity-60">Follow these steps in order to bring a new device or admin online.</p>
<div id="steps" class="space-y-3"></div></main>`;
const STEPS=[
['monitor-smartphone','Install the extension','On the client PC, open chrome://extensions, enable Developer mode, and Load Unpacked the extension/ folder.'],
['wifi','Verify connectivity','Make sure the client PC has internet access and can reach Firebase.'],
['bell-ring','Enable Telegram alerts','Go to Controls, save your bot token and chat ID, then visit a flagged site to test.'],
['camera','Test screen capture','Select a device and press the floating camera button. The photo should appear under Captures.'],
['shield','Configure blocking','In Controls, set the block list or turn on Lockdown mode. The client should see a network-error style page.'],
['clock','Schedules & auto-capture','In Controls, turn Auto Capture on and set the night schedule if needed.'],
['rocket','Go live','Open the Dashboard — the device should show as online in Live Status.']];
steps.innerHTML=STEPS.map((s,i)=>`<div class="bg-[#111c33] border border-white/5 rounded-2xl p-4 flex gap-3 items-start hover:border-emerald-400/40 transition"><span class="text-xs font-bold text-emerald-300 mt-1">0${i+1}</span><i data-lucide="${s[0]}" class="w-6 h-6 text-emerald-300 shrink-0 mt-0.5"></i><div><b>${s[1]}</b><div class="text-sm opacity-60">${s[2]}</div></div></div>`).join('');
if(window.lucide)lucide.createIcons();
</script></body></html>
