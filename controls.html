<!DOCTYPE html><html><head><meta charset="utf-8"><script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script></head>
<body class="bg-[#0b1220] text-slate-100"><div class="flex" id="lay"></div>
<script src="common.js"></script><script>
if(isMod()){alert('moderator: view only');location.href='dashboard.html'+devQS();}
lay.innerHTML=nav('controls.html')+`<main class="flex-1 p-4 md:p-6 max-w-xl space-y-4"><div id="topbar"></div>
<div class="bg-violet-500/10 border border-violet-500/40 rounded-2xl p-5 space-y-2"><b class="flex items-center gap-2"><i data-lucide="megaphone" class="w-4 h-4"></i>Push Announcement</b><p class="text-xs opacity-60">A full-screen notice will appear on the selected device</p><textarea id="amsg" rows="2" class="w-full bg-slate-800 rounded-lg px-3 py-2" placeholder="Type message..."></textarea><button onclick="sendAnnounce()" class="bg-violet-500 rounded-lg px-4 py-2 text-sm font-bold">📢 Send to ${QDEV||'device'}</button></div>
<div class="bg-red-500/10 border border-red-500/40 rounded-2xl p-5 space-y-2"><b class="flex items-center gap-2"><i data-lucide="lock" class="w-4 h-4"></i>Lockdown Mode (exam mode)</b><p class="text-xs opacity-60">When ON, everything except allowed sites is blocked + violation alerts go to Telegram</p><input id="ld" class="w-full bg-slate-800 rounded-lg px-3 py-2" placeholder="allowed: school.edu, exam.com"><div class="flex gap-2"><button onclick="lockOn()" class="bg-red-500 rounded-lg px-4 py-2 text-sm font-bold flex-1">🔒 Lockdown ON</button><button onclick="lockOff()" class="bg-slate-700 rounded-lg px-4 py-2 text-sm flex-1">Unlock</button></div></div>
<div class="bg-[#111c33] rounded-2xl p-5 space-y-2"><b class="flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4"></i>Night Schedule (per selected device)</b><div class="flex gap-2"><input id="s1" type="time" value="22:00" class="bg-slate-800 rounded-lg px-3 py-2"><input id="s2" type="time" value="22:00" class="bg-slate-800 rounded-lg px-3 py-2"></div><p class="text-xs opacity-50">1st = auto-block after, 2nd = auto-shot off after</p><button onclick="saveSched()" class="bg-amber-400 text-slate-950 rounded-lg px-4 py-2 text-sm font-bold">Save schedule</button></div>
<div class="bg-[#111c33] rounded-2xl p-5 space-y-2"><b class="flex items-center gap-2"><i data-lucide="send" class="w-4 h-4"></i>Telegram Alerts</b><input id="tg_t" class="w-full bg-slate-800 rounded-lg px-3 py-2" placeholder="bot token"><input id="tg_c" class="w-full bg-slate-800 rounded-lg px-3 py-2" placeholder="chat id"><button onclick="saveTg()" class="bg-sky-600 rounded-lg px-4 py-2 text-sm font-bold">Save Telegram</button><p class="text-xs opacity-50">Keyword and block alerts will be sent here</p></div>
<div class="bg-[#111c33] rounded-2xl p-5 space-y-2"><b class="flex items-center gap-2"><i data-lucide="ban" class="w-4 h-4"></i>Global Block List</b><input id="blk" class="w-full bg-slate-800 rounded-lg px-3 py-2" placeholder="facebook.com, youtube.com"><button onclick="saveBlock()" class="bg-red-500 rounded-lg px-4 py-2 text-sm font-bold">Save & Push</button>
<div class="text-[11px] uppercase tracking-widest opacity-40 pt-1">Currently blocked — click ✕ to unblock instantly</div><div id="blist" class="flex flex-wrap gap-2"></div><button onclick="unblockAll()" class="text-xs opacity-60 hover:opacity-100 hover:text-emerald-300">Unblock all sites</button></div>

<div class="bg-[#111c33] rounded-2xl p-5 space-y-2"><b class="flex items-center gap-2"><i data-lucide="camera" class="w-4 h-4"></i>Auto Capture</b><p class="text-xs opacity-50">Device: <span id="as_dev">—</span> • Status: <span id="as_st">...</span></p><div class="flex gap-2"><button onclick="autoShot(true)" class="bg-emerald-400 text-slate-950 rounded-lg px-4 py-2 text-sm font-bold flex-1">▶ ON</button><button onclick="autoShot(false)" class="bg-red-500 rounded-lg px-4 py-2 text-sm font-bold flex-1">⏸ OFF</button></div><div class="flex gap-2"><input id="asec" type="number" value="60" class="w-full bg-slate-800 rounded-lg px-3 py-2" placeholder="sec"><button onclick="saveAsec()" class="bg-slate-700 rounded-lg px-4 text-sm font-bold">Set sec</button></div></div>
<div class="bg-[#111c33] rounded-2xl p-5 flex gap-2"><button onclick="exportCSV()" class="bg-sky-600 rounded-lg px-4 py-2 text-sm font-bold">⬇ Export CSV</button><button onclick="cleanup()" class="bg-red-500/20 border border-red-500/40 rounded-lg px-4 py-2 text-sm">🗑 Delete 30d+ data</button></div></main>`;
mountTopbar('Controls'+(QDEV?' — '+QDEV:''),'settings-2');
function saveBlock(){const l=blk.value.split(',').map(s=>s.trim()).filter(Boolean);db.ref('global_block').set({list:l});if(QDEV)db.ref('commands/'+QDEV).push({cmd:'block_list',list:l});alert('saved');}
db.ref('global_block').on('value',s=>{const l=(s.val()||{}).list||[];
blist.innerHTML=l.map(d=>`<span class="flex items-center gap-1.5 bg-red-500/15 border border-red-500/40 rounded-full pl-3 pr-1.5 py-1 text-xs">🚫 ${d}<button onclick="unblock('${d}')" class="w-5 h-5 rounded-full bg-red-500 text-white text-[11px] font-bold">✕</button></span>`).join('')||'<span class="text-xs opacity-50">Nothing blocked</span>';if(window.lucide)lucide.createIcons();});
async function unblock(d){const s=await db.ref('global_block').once('value');const l=((s.val()||{}).list||[]).filter(x=>x!==d);
await db.ref('global_block').set({list:l});if(QDEV)db.ref('commands/'+QDEV).push({cmd:'block_list',list:l});}
async function unblockAll(){if(!confirm('Clear ALL blocked sites?'))return;
await db.ref('global_block').set({list:[]});if(QDEV)db.ref('commands/'+QDEV).push({cmd:'block_list',list:[]});}
function sendAnnounce(){if(!QDEV)return alert('Select a device first');const t=amsg.value.trim();if(!t)return alert('Type a message');db.ref('commands/'+QDEV).push({cmd:'message',text:t.replace(/</g,'&lt;'),ts:Date.now()});amsg.value='';alert('Sent to '+QDEV);}
function saveCfg(){db.ref('commands/'+dev2.value).push({cmd:'config',cfg:{autoShotSec:+asec.value}});alert('saved');}
function autoShot(on){if(!QDEV)return alert('Select a device first');db.ref('autoshot/'+QDEV).set({autoShot:on});db.ref('commands/'+QDEV).push({cmd:'config',cfg:{autoShot:on}});alert(on?'▶ auto-capture ON':'⏸ auto-capture OFF');loadAsSt();}
function saveAsec(){if(!QDEV)return alert('Select a device first');const v=+asec.value||60;db.ref('autoshot/'+QDEV).update({autoShotSec:v});db.ref('commands/'+QDEV).push({cmd:'config',cfg:{autoShotSec:v}});alert('interval '+v+'s');}
async function loadAsSt(){if(!QDEV){as_dev.innerText='—';return;}as_dev.innerText=QDEV;try{const s=await db.ref('autoshot/'+QDEV).once('value');const v=s.val();as_st.innerText=(!v||v.autoShot!==false)?'🟢 ON':'🔴 OFF';if(v?.autoShotSec)asec.value=v.autoShotSec;}catch(e){}}
loadAsSt();
function saveSched(){if(!QDEV)return alert('Select a device first');db.ref('schedules/'+QDEV).set({blockAfter:s1.value,shotOffAfter:s2.value});db.ref('commands/'+QDEV).push({cmd:'schedule',sched:{blockAfter:s1.value,shotOffAfter:s2.value}});alert('schedule saved');}
function saveTg(){db.ref('settings/telegram').set({token:tg_t.value,chat:tg_c.value});alert('telegram saved');}
function lockOn(){if(!QDEV)return alert('Select a device first');const allowed=ld.value.split(',').map(s=>s.trim()).filter(Boolean);if(!allowed.length)return alert('Enter allowed sites');const lock={on:true,allowed};db.ref('lockdown/'+QDEV).set(lock);db.ref('commands/'+QDEV).push({cmd:'lockdown',lock});alert('🔒 lockdown ON');}
function lockOff(){if(!QDEV)return alert('Select a device first');db.ref('lockdown/'+QDEV).set({on:false,allowed:[]});db.ref('commands/'+QDEV).push({cmd:'lockdown',lock:{on:false,allowed:[]}});alert('unlocked');}
async function exportCSV(){const a=await getEvents(1000);let csv='type,client,url,sec,time\n'+a.map(e=>[e.type,e.clientId,(e.data?.url||'').replace(/,/g,';'),e.data?.sec||'',new Date(e.ts).toISOString()].join(',')).join('\n');const x=document.createElement('a');x.href=URL.createObjectURL(new Blob([csv]));x.download='report.csv';x.click();}
async function cleanup(){if(!confirm('delete 30d+?'))return;const s=await db.ref('events').once('value');const v=s.val()||{};const cut=Date.now()-30*864e5;for(const[k,e]of Object.entries(v))if(e.ts<cut)await db.ref('events/'+k).remove();alert('done');}
</script></body></html>
